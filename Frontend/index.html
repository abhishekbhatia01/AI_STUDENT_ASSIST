<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Studyen is currently under development and will be online soon."
    />
    <meta name="theme-color" content="#12263a" />
    <title>StudyZen | Coming Soon</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23ef6f61'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Georgia,serif' font-size='38' font-weight='700' fill='white'%3ES%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="maintenance-card" aria-labelledby="page-title">
        <div class="card-content">
          <div class="brand-mark" aria-hidden="true">S</div>
          <p class="eyebrow">StudyZen</p>
          <div class="status-badge">
            <span class="status-dot"></span>Under Development
          </div>
          <h1 id="page-title">We’re building a better way to learn.</h1>
          <p class="intro">
            We're working behind the scenes to make your learning experience
            better.
          </p>
          <p class="status-message">
            Our website is currently under development. It will be online soon.
            Thank you for your patience.
          </p>
        </div>

        <div
          class="illustration"
          aria-label="Laptop under construction illustration"
          role="img"
        >
          <div class="spark spark-one"></div>
          <div class="spark spark-two"></div>
          <div class="spark spark-three"></div>
          <div class="laptop">
            <div class="screen">
              <span class="screen-line line-one"></span
              ><span class="screen-line line-two"></span
              ><span class="screen-line line-three"></span
              ><span class="screen-cursor"></span>
            </div>
            <div class="base"></div>
          </div>
          <div class="tool tool-hammer">⌁</div>
          <div class="tool tool-star">✦</div>
        </div>
      </section>
    </main>
    <footer>© 2026 Studyen. All rights reserved.</footer>
  </body>
</html>
